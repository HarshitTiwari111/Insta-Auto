# Render Blueprint: API + worker + Postgres + Redis (Key Value). The PWA goes on Vercel (DEPLOY.md).
# Secrets marked `sync: false` are asked for when the Blueprint is created.
services:
  - type: web
    name: instaauto-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:api
    plan: starter
    healthCheckPath: /health
    preDeployCommand: npm run db:deploy
    # Uploaded media must survive restarts/deploys
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 5
    envVars: &env
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: instaauto-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: instaauto-redis
          property: connectionString
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: APP_URL
        sync: false # https://<your-app>.vercel.app
      - key: API_PUBLIC_URL
        sync: false # https://instaauto-api.onrender.com
      - key: IG_LOGIN_MODE
        value: facebook
      - key: IG_APP_ID
        sync: false
      - key: IG_APP_SECRET
        sync: false
      - key: IG_API_VERSION
        value: v26.0
      - key: IG_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: TOKEN_ENC_KEY
        sync: false # copy from your local .env, or existing tokens can't be decrypted
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: COMMENT_POLL_MINUTES
        value: "2"

  - type: worker
    name: instaauto-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:worker
    plan: starter
    envVars: *env

  - type: keyvalue
    name: instaauto-redis
    plan: starter
    # BullMQ: never evict keys (would silently drop jobs)
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: instaauto-db
    plan: basic-256mb
    databaseName: instaauto
    user: instaauto
